name: Test
on:
  push:
    # Pushes to main only; PRs trigger via pull_request to avoid duplicate runs.
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  # Lint is platform-independent, so run it once on a single runner rather than
  # across the test matrix. Private repo -> self-hosted sfdc-hk-* runners.
  lint:
    runs-on: sfdc-hk-ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - run: npm ci
      - run: npm run lint

  # Cross-platform gate: `npm test` runs compile, the vitest unit tests, the oclif
  # snapshot/schema gates, and link-check. Lint is a separate job.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [22.x, 24.x]
        os:
          [sfdc-hk-ubuntu-latest, sfdc-hk-macos-latest, sfdc-hk-windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - name: unit tests + schema/snapshot gates
        run: npm test

  # NUTs run through the built plugin, so dist/ must be compiled first. `sf compute
  # generate` scaffolds locally and fetches starter source from GitHub -- no org
  # auth or scratch org, hence no secrets.
  nuts:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [sfdc-hk-ubuntu-latest, sfdc-hk-windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - run: npm ci
      - run: npm run build
      - name: Generate oclif manifest
        # Make oclif load commands from dist/. Without it, vitest's NODE_ENV=test
        # flips oclif to transpile mode, where it fails to resolve commands from src/.
        run: npx oclif manifest
      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli
      - name: nuts
        run: npm run test:nuts

  # Rehearses the release signing path (pack, sign, verify locally, npm publish
  # --dry-run) with no credentials, so signing breakage shows up before release.
  # Depends on npm-release-workflows PR #71 (the sign-and-publish action); the ref
  # below is that PR's branch, so switch it to @main once #71 merges. Not a required
  # check. `npm ci` already builds via `prepare`.
  signing-dry-run:
    if: github.event_name == 'pull_request'
    runs-on: sfdc-hk-ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - run: npm ci
      - name: Sign and publish (dry run)
        uses: heroku/npm-release-workflows/.github/actions/sign-and-publish@worker/plugin-trust-signing-stubs-task-1
        with:
          signing-mode: dry-run
          npm_tag: latest
          dry_run: "true"
