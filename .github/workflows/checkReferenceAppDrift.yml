name: checkReferenceAppDrift
on:
  schedule:
    - cron: '0 13 * * 1' # Mondays at 13:00 UTC
  workflow_dispatch:

jobs:
  check-drift:
    runs-on: sfdc-hk-ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run compile
      - run: node scripts/check-reference-app-drift.mjs
      - name: Announce drift
        if: failure()
        uses: slackapi/slack-github-action@v4.0.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.CLI_ALERTS_SLACK_WEBHOOK }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
          JOB_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          payload: |
            {
              "text": "plugin-compute's pinned Heroku AppLink reference-app commit(s) are behind upstream HEAD",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*plugin-compute*: `sf compute generate`'s pinned reference-app commit(s) are behind upstream HEAD.\n*Job:* ${{ env.JOB_URL }}"
                  }
                }
              ]
            }
