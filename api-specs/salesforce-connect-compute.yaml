openapi: 3.0.3
info:
  title: Salesforce Compute Connect API
  description: >-
    Salesforce Connect REST APIs that the `sf compute` CLI calls directly
    against a target org. Sourced from the `heroku-integration-connect-api`
    module in core (ComputeSourceUploadRepresentation.java,
    IComputeSourceUploadResource.java). Covers the deployment bundle source
    upload used by `sf compute deploy`, the build log lookup used by
    `sf compute build output`, the log session creation used by
    `sf compute logs`, and the dyno formation update used by `sf compute
    scale`; add further Compute Connect resources here as they land in core.
  version: '64.0'
externalDocs:
  description: Connect REST API developer guide
  url: https://developer.salesforce.com/docs/atlas.en-us.uxapi.meta/uxapi/
servers:
  - url: https://{instance}/services/data/v64.0
    variables:
      instance:
        default: yourInstance.my.salesforce.com
        description: The target org's My Domain hostname.
security:
  - bearerAuth: []
tags:
  - name: Compute
    description: >-
      Resources for deploying and managing Compute apps. GET
      /connect/compute/{app_id_or_name}/source below (downloadComputeSource,
      used by `sf compute source retrieve` alongside a standard Metadata API
      retrieve of the app's Compute metadata) is drafted speculatively ahead
      of core landing it -- only the POST /connect/compute/source upload
      above it is actually shipped in core (IComputeSourceUploadResource,
      PostableResource only, no GET). Deliberately placed on its own
      {app_id_or_name}/source path rather than mirroring the flat upload
      path, to keep app_id_or_name as a path param per the Connect API
      path-vs-query convention (it identifies which resource, not a filter),
      matching /connect/compute/{app_id_or_name},
      /connect/compute/{app_id_or_name}/formation, and
      /connect/compute/{app_id_or_name}/config-vars below. Same
      sanctioned-ahead-of-core-landing status as those resources -- update
      this spec if the real resource's shape differs once it ships.
      /connect/compute/{app_id_or_name}/formation/{formation_id_or_type}
      below is drafted speculatively ahead of core landing it (sanctioned
      exception to the "confirm with core first" rule above) -- update this
      spec once the real resource ships if its shape differs. Deliberately
      mirrors Heroku's own /apps/{app_id_or_name}/formation/{formation_id_or_type}
      path and request/response field names (snake_case dyno_size, not this
      file's usual camelCase) rather than a Connect-idiomatic shape, since
      it's currently unresolved whether GA calls this org-mediated resource
      or lets the CLI call Heroku directly with a forthcoming app-scoped
      token -- an identical wire shape means that decision won't require a
      body-mapping rewrite either way.
      /connect/compute/{app_id_or_name}/config-vars below is also drafted
      speculatively ahead of core landing it, for the same reason. Its GET
      and its request body mirror Heroku's own
      /apps/{app_id_or_name}/config-vars shape exactly (a flat string map;
      null deletes a key). Its PATCH *response*, however, is deliberately
      NOT a mirror of Heroku's (which returns only the bare updated map) --
      it additionally returns the resulting release version, because unlike
      formation this resource has no undecided direct-Heroku fork to stay
      wire-compatible with (config is, and will stay, org-mediated only) and
      bundling the version here saves `sf compute config set`/`unset` a
      second round trip to list releases the way Heroku's own CLI does
      internally. Confirm this composed shape with the core team / GUS
      before treating it as final, same as any other net-new resource.
      GET /connect/compute/{app_id_or_name} and GET
      /connect/compute/{app_id_or_name}/formation below are also drafted
      speculatively ahead of core landing them, tracked by W-24154928 ("[API]
      Fetch compute app metadata and dyno formation via Connect API (display
      command)"). They mirror Heroku's own GET /apps/{app_id_or_name} and GET
      /apps/{app_id_or_name}/formation field names and nesting (snake_case,
      nested id/name objects for generation/region/space) rather than a
      Connect-idiomatic shape, for the same wire-compatibility reason as the
      formation PATCH above. `sf compute display` calls both to fill in the
      Heroku App table's App Name/Region/Generation/Formation rows, replacing
      the HEROKU_API_TOKEN escape hatch and the permanent placeholder dashes.
      Confirm this shape with the core team / GUS before treating it as
      final, same as any other net-new resource.
paths:
  /connect/compute/source:
    post:
      operationId: uploadComputeSource
      summary: Upload a Compute deployment bundle source
      description: >-
        Uploads a Heroku Compute deployment bundle (OpenAPI spec plus
        application source tarball) for a named Compute app. This only
        creates a pending PlatformComputeAppBuild record -- it does not start
        a build by itself. Deploying the app's compute-meta.xml through the
        Metadata API is what triggers the build. Requires the
        `DeployCompute` user permission. This is an Expensive-cost Connect
        resource -- callers should avoid polling it and should instead poll
        build status separately.
      tags: [Compute]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, bundle]
              properties:
                name:
                  type: string
                  description: >-
                    DeveloperName of the PlatformComputeApp to deploy source
                    for.
                  example: CreditRatingScorer
                bundle:
                  type: string
                  format: binary
                  description: >-
                    Nested deployment bundle tarball (deployment-bundle.tar.gz)
                    containing the app's OpenAPI spec and source tree.
            encoding:
              bundle:
                contentType: application/gzip
      responses:
        '200':
          description: >-
            Source uploaded; a pending PlatformComputeAppBuild record was
            created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeSourceUpload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /connect/compute/{app_id_or_name}/source:
    get:
      operationId: downloadComputeSource
      summary: Download a Compute app's deployed source
      description: >-
        Downloads the same nested deployment bundle (OpenAPI spec plus
        application source tarball) most recently deployed for a Compute app
        -- the GET counterpart to the upload above, used by `sf compute
        source retrieve` alongside a Metadata API retrieve of the app's
        compute-meta.xml. Also accepts a C2C JWT (minted for the
        `sfdc.salesforce-compute` Core CASC integration) for Heroku Builds'
        own inbound fetch, in addition to a standard org access token.
        Requires the `DeployCompute` or `ManageCompute` user permission on
        the standard-token path. Speculative resource -- see the Compute tag
        description above; not yet built in core. See W-23502012.
      tags: [Compute]
      parameters:
        - name: app_id_or_name
          in: path
          required: true
          schema:
            type: string
          description: PlatformComputeApp Id or DeveloperName.
          example: CreditRatingScorer
      responses:
        '200':
          description: >-
            Deployment bundle tarball (deployment-bundle.tar.gz) most
            recently deployed for the app.
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /connect/compute/build/output:
    get:
      operationId: fetchComputeBuildOutput
      summary: Fetch the latest build's compile/deploy log
      description: >-
        Returns the bounded build/compile log (dependency install, slug
        compile, release) for the most recent build of a Compute app. This is
        a one-shot fetch of a finished-or-in-progress log, not a live stream --
        `sf compute logs --tail` covers the ongoing runtime log. Org calls
        Heroku's Build Info API on the customer's behalf and returns the log
        body; the CLI never talks to Heroku directly. Returns 404 if the org
        hasn't ingested a build listing for this app's current build yet
        (e.g. the build was only just enqueued).
      tags: [Compute]
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
          description: DeveloperName of the PlatformComputeApp to fetch build output for.
          example: CreditRatingScorer
      responses:
        '200':
          description: Build/compile log body for the app's latest build.
          content:
            text/plain:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >-
            Either no PlatformComputeApp exists with the given name, or the org
            hasn't ingested a build listing for this app's current build yet.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConnectError'
  /connect/compute/logs/session:
    post:
      operationId: createComputeLogSession
      summary: Create a log session for a Compute app
      description: >-
        Creates a short-lived, pre-authorized session URL for streaming or
        tailing a Compute app's runtime logs. Org calls Heroku's Create Log
        Session API on the customer's behalf; the CLI never holds a Heroku
        credential. The returned `logplexUrl` is itself the auth mechanism --
        the CLI fetches or streams from it directly, without going through
        this org connection. Requires the `DeployCompute` or `ManageCompute`
        user permission.
      tags: [Compute]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComputeLogSessionCreate'
      responses:
        '201':
          description: Log session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeLogSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >-
            Either no PlatformComputeApp exists with the given name, or
            Heroku hasn't provisioned a log-streamable app for it yet.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConnectError'
  /connect/compute/{app_id_or_name}:
    get:
      operationId: fetchComputeAppMetadata
      summary: Get a Compute app's Heroku-side metadata
      description: >-
        Returns Heroku-side app metadata (region, space, generation) for a
        Compute app. Org calls Heroku's Get App Info API on the customer's
        behalf; the CLI never talks to Heroku directly unless
        HEROKU_API_TOKEN is set, in which case `sf compute display` bypasses
        the org and calls Heroku directly instead. Requires the
        `DeployCompute` or `ManageCompute` user permission.
      tags: [Compute]
      parameters:
        - name: app_id_or_name
          in: path
          required: true
          schema:
            type: string
          description: PlatformComputeApp Id or DeveloperName.
          example: CreditRatingScorer
      responses:
        '200':
          description: The app's Heroku-side metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeAppMetadata'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /connect/compute/{app_id_or_name}/formation:
    get:
      operationId: fetchComputeFormation
      summary: Get a Compute app's full dyno formation
      description: >-
        Returns the dyno formation (size and quantity per process type) for a
        Compute app. Org calls Heroku's List Formation API on the customer's
        behalf; the CLI never talks to Heroku directly unless
        HEROKU_API_TOKEN is set, in which case `sf compute display` bypasses
        the org and calls Heroku directly instead. Requires the
        `DeployCompute` or `ManageCompute` user permission. This is the
        collection-level GET counterpart to the per-process-type PATCH below.
      tags: [Compute]
      parameters:
        - name: app_id_or_name
          in: path
          required: true
          schema:
            type: string
          description: PlatformComputeApp Id or DeveloperName.
          example: CreditRatingScorer
      responses:
        '200':
          description: The app's current dyno formation, one entry per process type.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ComputeFormation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /connect/compute/{app_id_or_name}/formation/{formation_id_or_type}:
    patch:
      operationId: updateComputeFormation
      summary: Update a Compute app's dyno formation for one process type
      description: >-
        Updates the dyno size and/or quantity for one process type of a
        Compute app's dyno formation. Org calls Heroku's Update Formation API
        on the customer's behalf; the CLI never talks to Heroku directly
        unless HEROKU_API_TOKEN is set, in which case `sf compute scale`
        bypasses the org and calls Heroku directly instead. Requires the
        `ManageCompute` user permission.
      tags: [Compute]
      parameters:
        - name: app_id_or_name
          in: path
          required: true
          schema:
            type: string
          description: PlatformComputeApp Id or DeveloperName to scale.
          example: CreditRatingScorer
        - name: formation_id_or_type
          in: path
          required: true
          schema:
            type: string
          description: Heroku process type to scale (e.g. web, worker).
          example: web
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComputeFormationUpdate'
      responses:
        '200':
          description: Updated dyno formation for the process type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeFormation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >-
            Either no PlatformComputeApp exists with the given Id/name, or it
            has no such process type in its dyno formation.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConnectError'
  /connect/compute/{app_id_or_name}/config-vars:
    parameters:
      - name: app_id_or_name
        in: path
        required: true
        schema:
          type: string
        description: PlatformComputeApp Id or DeveloperName.
        example: CreditRatingScorer
    get:
      operationId: fetchComputeConfigVars
      summary: Get a Compute app's runtime config vars
      description: >-
        Returns the full set of config vars (environment variables) for a
        Compute app. Org calls Heroku's Config Vars API on the customer's
        behalf; the CLI never talks to Heroku directly. Requires the
        `DeployCompute` or `ManageCompute` user permission.
      tags: [Compute]
      responses:
        '200':
          description: The app's current config vars.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeConfigVars'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateComputeConfigVars
      summary: Set or unset one or more of a Compute app's config vars
      description: >-
        Sets and/or unsets config vars for a Compute app in one call -- a
        null value for a key unsets it, mirroring Heroku's own Config Vars
        Update API exactly. Org calls Heroku on the customer's behalf and
        then looks up the resulting release, returning both together -- see
        the Compute tag description above for why this response isn't a
        pure mirror of Heroku's (bare-map) response. Requires the
        `ManageCompute` user permission.
      tags: [Compute]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComputeConfigVarsUpdate'
      responses:
        '200':
          description: Updated config vars (full map) plus the resulting release.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeConfigVarsUpdateResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Salesforce OAuth access token
  schemas:
    ComputeSourceUpload:
      type: object
      description: Result of a Compute deployment bundle source upload.
      required: [platformComputeId, buildId, sourceBlobSize, uploadedAt]
      properties:
        platformComputeId:
          type: string
          description: PlatformComputeApp record Id.
          example: 0abEE0000004CqYYAU
        buildId:
          type: string
          description: PlatformComputeAppBuild record Id.
          example: 0acEE0000004D1ZYAU
        sourceBlobSize:
          type: integer
          format: int64
          description: Size in bytes of the uploaded source blob.
          example: 184320
        uploadedAt:
          type: string
          format: date-time
          description: Timestamp the source blob was uploaded.
    ComputeLogSessionCreate:
      type: object
      description: Parameters for creating a Compute app log session.
      required: [name]
      properties:
        name:
          type: string
          description: DeveloperName of the PlatformComputeApp to create a log session for.
          example: CreditRatingScorer
        lines:
          type: integer
          description: Number of historical log lines to backfill before new output.
          example: 100
        tail:
          type: boolean
          description: Whether the session should stay open for an ongoing live stream.
          example: false
    ComputeLogSession:
      type: object
      description: A Compute app log session.
      required: [logplexUrl]
      properties:
        logplexUrl:
          type: string
          format: uri
          description: >-
            Short-lived, pre-authorized URL to fetch or stream the app's
            runtime logs from directly.
          example: >-
            https://logplex.heroku.com/sessions/01234567-89ab-cdef-0123-456789abcdef?srv=1325419200
    ComputeAppMetadata:
      type: object
      description: >-
        A Compute app's Heroku-side metadata. Field names and nesting
        deliberately mirror Heroku's own App resource (snake_case, nested
        id/name objects) -- see the Compute tag description above. Includes
        name in addition to the region/generation/space W-24154928's subject
        line calls out, since `sf compute display`'s Heroku App table has an
        App Name row backed by Heroku's app name (distinct from the Compute
        App Name row above it, which is the Salesforce DeveloperName).
      required: [name, region, generation]
      properties:
        name:
          type: string
          description: Heroku app name (distinct from the PlatformComputeApp DeveloperName).
          example: creditratingscorer-a1b2c3
        region:
          type: object
          description: Heroku region the app runs in.
          properties:
            id: { type: string, format: uuid }
            name: { type: string, example: us }
        generation:
          type: object
          description: Heroku generation (e.g. fir, cedar) the app runs on.
          properties:
            id: { type: string, format: uuid }
            name: { type: string, example: fir }
        space:
          type: object
          nullable: true
          description: Private space the app runs in, if any.
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            shield: { type: boolean }
    ComputeFormationUpdate:
      type: object
      description: >-
        Requested dyno size/quantity change for one process type. Field
        names deliberately mirror Heroku's own FormationUpdateRequest
        (snake_case dyno_size, not this file's usual camelCase) -- see the
        Compute tag description above.
      properties:
        dyno_size:
          type: object
          description: Heroku dyno size to scale the process type to, by name.
          properties:
            name:
              type: string
              example: eco
        quantity:
          type: integer
          description: Number of dynos to run for the process type. 0 stops it.
          example: 2
    ComputeFormation:
      type: object
      description: >-
        A Compute app's dyno formation for one process type, after update.
        Field names deliberately mirror Heroku's own Formation resource
        (snake_case dyno_size, not this file's usual camelCase) -- see the
        Compute tag description above.
      required: [type, quantity]
      properties:
        type:
          type: string
          description: Heroku process type (e.g. web, worker).
          example: web
        dyno_size:
          type: object
          description: Heroku dyno size currently assigned to the process type.
          properties:
            name:
              type: string
              example: eco
        quantity:
          type: integer
          description: Number of dynos currently running for the process type.
          example: 2
    ComputeConfigVars:
      type: object
      description: >-
        Flat map of config var name to value. Mirrors Heroku's own
        ConfigVars resource exactly -- see the Compute tag description
        above.
      additionalProperties:
        type: string
      example:
        LOG_LEVEL: info
        STRIPE_KEY: sk_live_abc123
    ComputeConfigVarsUpdate:
      type: object
      description: >-
        Config var names to set, mapped to their new value; a null value
        unsets that config var. Mirrors Heroku's own ConfigVarsUpdate
        resource exactly -- see the Compute tag description above.
      additionalProperties:
        type: string
        nullable: true
      example:
        STRIPE_KEY: sk_live_xyz789
        LOG_LEVEL: null
    ComputeConfigVarsUpdateResult:
      type: object
      description: >-
        Result of a config var update -- the full updated config var map
        plus the resulting release version. Deliberately not a pure mirror
        of Heroku's own (bare-map) PATCH response -- see the Compute tag
        description above.
      required: [configVars]
      properties:
        configVars:
          $ref: '#/components/schemas/ComputeConfigVars'
        release:
          type: integer
          description: Version of the release created by this config var change.
          example: 11
    ConnectError:
      type: object
      description: Standard Salesforce Connect API error shape.
      properties:
        message:
          type: string
        errorCode:
          type: string
      required: [message, errorCode]
  responses:
    BadRequest:
      description: Malformed request (e.g. missing name/bundle, invalid tarball).
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ConnectError'
    Forbidden:
      description: Caller lacks the DeployCompute permission.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ConnectError'
    NotFound:
      description: No PlatformComputeApp exists with the given name.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ConnectError'
