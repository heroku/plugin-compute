openapi: 3.0.3
info:
  title: Salesforce Compute Connect API
  description: >-
    Salesforce Connect REST APIs that the `sf compute` CLI calls directly
    against a target org. Sourced from the `heroku-integration-connect-api`
    module in core (ComputeSourceUploadRepresentation.java,
    IComputeSourceUploadResource.java). Covers the deployment bundle source
    upload/download used by `sf compute deploy` and `sf compute source
    retrieve`; add further Compute Connect resources here as they land in
    core. The build log lookup (`sf compute get build-log`), log session
    creation (`sf compute get runtime-log` / `sf compute tail runtime-log`),
    and dyno formation update (`sf compute scale`) have all moved off Connect
    onto the Salesforce Heroku API proxy --
    see the Compute tag description below.
  version: '64.0'
externalDocs:
  description: Connect REST API developer guide
  url: https://developer.salesforce.com/docs/atlas.en-us.uxapi.meta/uxapi/
servers:
  - url: https://{instance}/services/data/v64.0
    variables:
      instance:
        default: yourInstance.my.salesforce.com
        description: The target org's My Domain hostname.
security:
  - bearerAuth: []
tags:
  - name: Compute
    description: >-
      Resources for deploying and managing Compute apps. GET
      /connect/compute/{app_id_or_name}/source below (downloadComputeSource,
      used by `sf compute source retrieve` alongside a standard Metadata API
      retrieve of the app's Compute metadata) is drafted speculatively ahead
      of core landing it -- only the POST /connect/compute/source upload
      above it is actually shipped in core (IComputeSourceUploadResource,
      PostableResource only, no GET). Deliberately placed on its own
      {app_id_or_name}/source path rather than mirroring the flat upload
      path, to keep app_id_or_name as a path param per the Connect API
      path-vs-query convention (it identifies which resource, not a filter).
      Same sanctioned-ahead-of-core-landing status -- update this spec if the
      real resource's shape differs once it ships.
      Formation, config-vars, app-metadata, build-output, and log-session
      resources that were previously drafted here have moved off Connect
      entirely: they're served through the Salesforce Heroku API proxy
      (/services/data/vXX.0/heroku/proxy, see herokuProxyApi.ts) so the CLI
      never needs a Connect resource shaped around Heroku's data. See
      heroku-platform-api.yaml for those resources' shapes instead.
paths:
  /connect/compute/source:
    post:
      operationId: uploadComputeSource
      summary: Upload a Compute deployment bundle source
      description: >-
        Uploads a Heroku Compute deployment bundle (OpenAPI spec plus
        application source tarball) for a named Compute app. This only
        creates a pending PlatformComputeAppBuild record -- it does not start
        a build by itself. Deploying the app's compute-meta.xml through the
        Metadata API is what triggers the build. Requires the
        `DeployCompute` user permission. This is an Expensive-cost Connect
        resource -- callers should avoid polling it and should instead poll
        build status separately.
      tags: [Compute]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, bundle]
              properties:
                name:
                  type: string
                  description: >-
                    DeveloperName of the PlatformComputeApp to deploy source
                    for.
                  example: CreditRatingScorer
                bundle:
                  type: string
                  format: binary
                  description: >-
                    Nested deployment bundle tarball (deployment-bundle.tar.gz)
                    containing the app's OpenAPI spec and source tree.
            encoding:
              bundle:
                contentType: application/gzip
      responses:
        '200':
          description: >-
            Source uploaded; a pending PlatformComputeAppBuild record was
            created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeSourceUpload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /connect/compute/{app_id_or_name}/source:
    get:
      operationId: downloadComputeSource
      summary: Download a Compute app's deployed source
      description: >-
        Downloads the same nested deployment bundle (OpenAPI spec plus
        application source tarball) most recently deployed for a Compute app
        -- the GET counterpart to the upload above, used by `sf compute
        source retrieve` alongside a Metadata API retrieve of the app's
        compute-meta.xml. Also accepts a C2C JWT (minted for the
        `sfdc.salesforce-compute` Core CASC integration) for Heroku Builds'
        own inbound fetch, in addition to a standard org access token.
        Requires the `DeployCompute` or `ManageCompute` user permission on
        the standard-token path. Speculative resource -- see the Compute tag
        description above; not yet built in core. See W-23502012.
      tags: [Compute]
      parameters:
        - name: app_id_or_name
          in: path
          required: true
          schema:
            type: string
          description: PlatformComputeApp Id or DeveloperName.
          example: CreditRatingScorer
      responses:
        '200':
          description: >-
            Deployment bundle tarball (deployment-bundle.tar.gz) most
            recently deployed for the app.
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Salesforce OAuth access token
  schemas:
    ComputeSourceUpload:
      type: object
      description: Result of a Compute deployment bundle source upload.
      required: [platformComputeId, buildId, sourceBlobSize, uploadedAt]
      properties:
        platformComputeId:
          type: string
          description: PlatformComputeApp record Id.
          example: 0abEE0000004CqYYAU
        buildId:
          type: string
          description: PlatformComputeAppBuild record Id.
          example: 0acEE0000004D1ZYAU
        sourceBlobSize:
          type: integer
          format: int64
          description: Size in bytes of the uploaded source blob.
          example: 184320
        uploadedAt:
          type: string
          format: date-time
          description: Timestamp the source blob was uploaded.
    ConnectError:
      type: object
      description: Standard Salesforce Connect API error shape.
      properties:
        message:
          type: string
        errorCode:
          type: string
      required: [message, errorCode]
  responses:
    BadRequest:
      description: Malformed request (e.g. missing name/bundle, invalid tarball).
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ConnectError'
    Forbidden:
      description: Caller lacks the DeployCompute permission.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ConnectError'
    NotFound:
      description: No PlatformComputeApp exists with the given name.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ConnectError'
