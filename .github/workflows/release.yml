name: Release

# Calls the reusable release workflow from npm-release-workflows
# Uses GitHub App (vars.DEV_TOOLS_RELEASE_WORKFLOW_APP_ID, secrets.DEV_TOOLS_RELEASE_WORKFLOW_APP_PRIVATE_KEY)

on:
  # Manual gate (deliberate, pre-GA): npm publishing runs only on manual dispatch.
  # The release-please PR itself is created/refreshed automatically on every push to
  # main by release-on-push.yml; this workflow performs the actual npm publish and is
  # kept manual. Do not convert this to an automatic trigger without a team decision.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test release without publishing (creates PR but skips npm publish)"
        type: boolean
        default: false
        required: false

jobs:
  release:
    uses: heroku/npm-release-workflows/.github/workflows/release.yml@main
    with:
      dry_run: ${{ inputs.dry_run }}
      runs_on: sfdc-hk-ubuntu-latest # Options: ubuntu-latest | sfdc-hk-ubuntu-latest | pub-hk-ubuntu-24.04-ip
      package-manager: npm # Options: npm | yarn | pnpm
      app_id: ${{ vars.DEV_TOOLS_RELEASE_WORKFLOW_APP_ID }}
      # owner scopes the token to the org installation so it can access all repos in the installation
      owner: ${{ github.repository_owner }}
      test_command: run test
      lint_command: run lint
      build_command: ''
      # Signing is off unless the repo variable PLUGIN_SIGNING_MODE is set (none | dry-run | aws-role).
      # aws-role also needs PLUGIN_SIGNING_BUCKET, PLUGIN_SIGNING_PUBLIC_HOST and PLUGIN_SIGNING_AWS_ROLE_ARN (no defaults).
      signing_mode: ${{ vars.PLUGIN_SIGNING_MODE || 'none' }}
      upload_bucket: ${{ vars.PLUGIN_SIGNING_BUCKET }}
      public_host: ${{ vars.PLUGIN_SIGNING_PUBLIC_HOST }}
      aws_role_arn: ${{ vars.PLUGIN_SIGNING_AWS_ROLE_ARN }}
    secrets:
      private_key: ${{ secrets.DEV_TOOLS_RELEASE_WORKFLOW_APP_PRIVATE_KEY }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write
